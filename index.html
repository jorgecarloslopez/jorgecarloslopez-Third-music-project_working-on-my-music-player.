<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Player Clone</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- creating the sidebar and shaping it as well -->
    <div class="sidebar">
      <div class="logo">
        <i class="fab fa-spotify"></i>
        <span>Spotify</span>
      </div>

      <div class="nav-section">
        <div class="nav-item active">
          <i class="fas fa-home"></i>
          <span>Inicio</span>
        </div>
        <div class="nav-item">
          <i class="fas fa-search"></i>
          <span>Buscar</span>
        </div>
        <div class="nav-item">
          <i class="fas fa-book"></i>
          <span>Tu biblioteca</span>
        </div>
      </div>

      <div class="nav-section">
        <div class="nav-item">
          <i class="fas fa-plus-square"></i>
          <span>Crear playlist</span>
        </div>
        <div class="nav-item">
          <i class="fas fa-heart"></i>
          <span>Tus me gusta</span>
        </div>
      </div>

      <div class="playlists">
        <div class="playlist-item active">Lista de reproducción 1</div>
        <div class="playlist-item">Mejores canciones 2024</div>
        <div class="playlist-item">Rock clásico</div>
        <div class="playlist-item">Pop en español</div>
        <div class="playlist-item">Música para programar</div>
        <div class="playlist-item">Relax y estudio</div>
      </div>
    </div>
  </body>
</html>
